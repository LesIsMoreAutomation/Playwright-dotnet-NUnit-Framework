# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

pool:
  vmImage: 'onprem-sa-windows'

variables:
  solution: '**/*.sln'
  buildPlatform: '17.5.0'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1
#- pwsh: bin/Debug/netX/playwright.ps1 install 
#- pwsh: bin/Debug/netX/playwright.ps1 install-deps chromium
- pwsh: dotnet --version
  displayName: Retrieve DotNet Version
- pwsh: dotnet --info
  displayName: Retrieve DotNet Info

- pwsh: bin/Debug/net6.0/playwright.ps1 install 
  displayName: Installing Playwright Browser

# Install VSTest 17.5.0
- task: VisualStudioTestPlatformInstaller@1
  inputs:
    packageFeedSelector: 'nugetOrg'
    versionSelector: 'specificVersion'
    testPlatformVersion: '17.5.0'

- task: VSTest@2
  inputs:
    testSelector: 'testAssemblies'
    # testAssemblyVer2: |
    #   CommunityAppsRegressionTests.dll
    # searchFolder: '$(System.DefaultWorkingDirectory)'
    # ------------  Use the version installed by installer -----------
    vsTestVersion: 'toolsInstaller'

