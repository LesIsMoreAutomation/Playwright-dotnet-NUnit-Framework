schedules:
- cron: "0 3 * * *"
  displayName: "Daily pipeline run at 3 AM"
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest
container: mcr.microsoft.com/playwright/dotnet:v1.34.0-jammy

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '7.0.x'
  displayName: 'Use .NET SDK'

- script: dotnet build --configuration Release
  displayName: 'Build'
- script: dotnet test --configuration Release
  displayName: 'Run tests'
