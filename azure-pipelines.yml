trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Playwright-dotnet-NUnit-Framework/*
      - nuget.config

pr:
  branches:
    include:
      - '*'

jobs:
  - job: build
    displayName: 'Build Job'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
        clean: true

      - task: UseDotNet@2
        displayName: 'Install .Net 6.0'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'

      - script: dotnet restore 'Playwright-dotnet-NUnit-Framework/SpecFlowWithPlaywright.csproj'
        displayName: 'Restore Packages'

      - script: dotnet build 'Playwright-dotnet-NUnit-Framework/SpecFlowWithPlaywright.csproj' --configuration Release
        displayName: 'Build Projects'

      - script: dotnet publish 'Playwright-dotnet-NUnit-Framework/SpecFlowWithPlaywright.csproj' --configuration Release --output $(Build.ArtifactStagingDirectory)
        displayName: 'Publish Test Project'
        condition: succeeded()

      - publish: $(Build.ArtifactStagingDirectory)
        displayName: 'Publish Artifacts'
        artifact: 'drop'
