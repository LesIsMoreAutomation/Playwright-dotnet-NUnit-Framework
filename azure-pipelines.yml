trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Playwright-dotnet-NUnit-Framework/*
      - nuget.config

pr:
  branches:
    include:
      - '*'

jobs:
  - job: build
    displayName: 'Build Job'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
        clean: true

      - task: UseDotNet@2
        displayName: 'Install .Net 6.0'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'

      - script: dotnet restore 'SpecFlowWithPlaywright.csproj'
        displayName: 'Restore Packages'

      - script: dotnet build 'SpecFlowWithPlaywright.csproj' --configuration Release
        displayName: 'Build Projects'
        condition: succeeded()

      - script: pwsh bin/Debug/net6.0/playwright.ps1 install --with-deps
        displayName: 'Install Playwright browsers'
      
      - script: dotnet test 'SpecFlowWithPlaywright.csproj' --configuration Release --logger trx --results-directory $(Build.ArtifactStagingDirectory)/TestResults
        displayName: 'Run Tests'
        condition: succeeded()

      - publish: $(Build.ArtifactStagingDirectory)
        displayName: 'Publish Artifacts'
        artifact: 'drop'
