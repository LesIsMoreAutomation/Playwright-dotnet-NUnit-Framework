trigger:
- main

pool:
  vmImage: ubuntu-latest
container: mcr.microsoft.com/playwright/dotnet:v1.34.0-jammy

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '6.0.x'
  displayName: 'Use .NET SDK'

- script: dotnet build --configuration Release
  displayName: 'Build'
- script: dotnet test --configuration Release
  displayName: 'Run tests'


- script: livingdoc test-assembly SpecFlowWithPlaywright.dll -t TestExecution.json
  displayName: 'Generate LivingDoc report'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'bin/Debug/net6.0/LivingDoc.html'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/livingdoc-report.zip'
  displayName: 'Zip LivingDoc report'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/livingdoc-report.zip'
    artifactName: 'livingdoc-report'
    publishLocation: 'pipeline'
  displayName: 'Publish LivingDoc report artifact'
