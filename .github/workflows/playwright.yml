name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Build project
        run: dotnet build

      - name: Install browsers
        run: pwsh bin/Debug/net6.0/playwright.ps1 install --with-deps

      - name: Run tests
        run: dotnet test

      - name: Generate SpecFlow+LivingDoc report
        run: dotnet livingdoc test-assembly bin/Debug/net6.0/SpecFlowWithPlaywright.dll -t TestExecution.json

      - name: Publish SpecFlow+LivingDoc report
        uses: actions/upload-artifact@v2
        with:
          name: SpecFlow+LivingDoc Report
          path: ./LivingDoc
