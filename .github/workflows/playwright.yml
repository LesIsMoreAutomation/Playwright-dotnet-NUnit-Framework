name: Playwright Tests

on:
  push:
  schedule:
    - cron: "0 5 * * 2"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build project
        run: dotnet build

      - name: Install browsers
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

      - name: Run tests
        run: dotnet test

      - name: Install dotnet-livingdoc CLI
        run: dotnet tool install --global SpecFlow.Plus.LivingDoc.CLI

      - name: Generate LivingDoc report
        working-directory: bin/Debug/net8.0
        run: livingdoc test-assembly SpecFlowWithPlaywright.dll -t TestExecution.json

      - name: Zip LivingDoc HTML artifacts
        run: zip -r LivingDoc.zip bin/Debug/net8.0/LivingDoc.html

      - name: Upload LivingDoc HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LivingDoc HTML
          path: LivingDoc.zip
